description: >-
  Cadence Design Systems is a multinational electronic design automation
  (EDA) software and hardware company. Cadence provides tools for designing
  integrated circuits, systems on chips, printed circuit boards, and
  pharmaceutical drugs, with a portfolio that includes Virtuoso, Spectre,
  Genus, Innovus, JasperGold, Xcelium, Palladium, Allegro, OrCAD, and AI
  tools such as Cerebrus and ChipGPT.
apis:
  - aid: cadence:cadence-design-systems
    name: Cadence Design Systems
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cadence.png
    tags:
      - EDA
      - Semiconductors
      - Chip Design
    humanURL: https://www.cadence.com
    properties:
      - type: Website
        url: https://www.cadence.com
      - type: Products
        url: https://www.cadence.com/en_US/home/tools.html
      - type: Support
        url: https://support.cadence.com
      - type: Community
        url: https://community.cadence.com
      - type: Investor Relations
        url: https://investor.cadence.com
      - type: Newsroom
        url: https://www.cadence.com/en_US/home/company/newsroom.html
      - type: Careers
        url: https://www.cadence.com/en_US/home/company/careers.html
    description: >-
      Cadence Design Systems delivers software and IP for electronic design
      automation, including IC and PCB design, verification, emulation, and
      system analysis. The EDA product lines (Virtuoso, Allegro X, OrCAD X,
      Xcelium, Innovus, JasperGold) are licensed desktop and compute software
      automated with SKILL and Tcl scripting inside the installed product, not
      network APIs, and Cadence publishes no machine-readable contract for them.
      The callable surfaces Cadence does operate are catalogued as separate API
      entries in this record.
  - aid: cadence:orion
    name: Orion Molecular Design Platform API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cadence.png
    tags:
      - Molecular Design
      - Drug Discovery
      - Cheminformatics
      - Scientific Computing
      - Cloud Platform
    humanURL: https://www.eyesopen.com/orion/platform
    baseURL: https://orion.eyesopen.com
    properties:
      - type: Documentation
        url: https://docs.eyesopen.com/orion-developer/index.html
      - type: APIReference
        url: https://docs.eyesopen.com/orion-developer/modules/orion-platform/docs/orionclient/cli.html
      - type: GettingStarted
        url: https://docs.eyesopen.com/orion-developer/development/intro.html
      - type: Authentication
        url: authentication/cadence-authentication.yml
      - type: CLI
        url: cli/cadence-cli.yml
      - type: Conventions
        url: conventions/cadence-conventions.yml
      - type: ChangeLog
        url: https://docs.eyesopen.com/orion-user-interface/releasenotes/index.html
      - type: SignUp
        url: https://www.eyesopen.com/orion-signup
    description: >-
      The cloud-native molecular design platform from OpenEye, Cadence Molecular
      Sciences — the Cadence Design Systems business unit acquired in 2022 (its
      documentation carries a Cadence Design Systems copyright). Orion runs
      cube/floe computational workflows, datasets, shard collections, jobs and
      GPU-backed molecule search. Clients authenticate with an account-issued
      token; the published interface is the orionclient Python library and the
      ocli command line interface, and no OpenAPI, GraphQL SDL or AsyncAPI
      contract is published for it. Base host read from the provider's own
      documented example ("Url of Orion Stack, ex: orion.eyesopen.com").
  - aid: cadence:mmds
    name: MMDS — Macromolecular Data Service
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cadence.png
    tags:
      - Structural Biology
      - Protein Data
      - Scientific Computing
      - Drug Discovery
    humanURL: https://docs.eyesopen.com/webservices/mmds/
    baseURL: https://mmds.eyesopen.com/api/v1/
    properties:
      - type: Documentation
        url: https://docs.eyesopen.com/webservices/mmds/
      - type: APIReference
        url: https://docs.eyesopen.com/webservices/mmds/client.html
      - type: GettingStarted
        url: https://docs.eyesopen.com/webservices/mmds/quickstart.html
      - type: Authentication
        url: authentication/cadence-authentication.yml
    description: >-
      A live HTTPS JSON API for macromolecular experimental data — experiments,
      sites, families, contexts, frames and results, keyed on PDB structure
      codes with .pdb/.cif structures, MTZ density and cryo-EM maps. Operated by
      OpenEye, Cadence Molecular Sciences, and reachable at
      https://mmds.eyesopen.com/api/v1/ — an unauthenticated GET on 2026-09-05
      returned HTTP 403 with a Django REST Framework body,
      {"detail":"Authentication credentials were not provided."}, which confirms
      the service is real and that every path is authentication-gated. No
      OpenAPI is published; the mmdsclient Python library and mmdscli CLI are
      the published interface.
