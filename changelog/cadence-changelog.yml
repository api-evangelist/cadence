description: >-
  The dated-by-version release notes Cadence publishes for the product lines that
  have a programmable surface. The Orion Molecular Design Platform carries a
  continuous public release-note series back to 2019.2.1; OpenEye Toolkits and
  OEApplications carry per-release highlights plus detailed per-component notes.
  Cadence's core EDA tools (Virtuoso, Allegro X, OrCAD X, Xcelium, Innovus)
  publish release information behind the support.cadence.com customer portal, not
  on a public changelog.
docs: https://docs.eyesopen.com/orion-user-interface/releasenotes/index.html
scheme: Calendar versioning — YYYY.N (Orion), YYYY.N (OEToolkits / OEApplications)
