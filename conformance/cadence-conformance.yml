      token_endpoint, userinfo_endpoint, jwks_uri, response_types_supported,
      subject_types_supported and id_token_signing_alg_values_supported —
      every OIDC Discovery required field. Saved verbatim to
      well-known/cadence-support-openid-configuration.json.
    scope: Cadence Online Support portal only.

  - id: oauth2
