domain_standards:
  - id: helm
    name: HELM (Hierarchical Editing Language for Macromolecules)
    conforms: true
    evidence: >-
      OpenEye Toolkits 2026.1 release highlights state that OEChem TK delivers
      "reliable conversion between molecular structures and HELM
      representations" with support for custom monomer dictionaries and a
      built-in dictionary of more than 260 monomers.
      https://docs.eyesopen.com/toolkits/python/releasenotes/highlights.html
    market: computational chemistry / peptide informatics
  - id: pdb-mmcif
    name: PDB / mmCIF experimental structure formats
    conforms: true
    evidence: >-
      The MMDS client API documents Experiment.add(session, code, structure,
      meta, ...) where `code` is a "Unique structure code (normally 4-leter code
      for public PDBs)" and `structure` is a ".pdb or .cif" filename, with
      optional MTZ X-ray density or MAP.GZ cryo-EM map.
      https://docs.eyesopen.com/webservices/mmds/client.html
    market: structural biology
  - id: smiles-smarts
    name: SMILES / SMARTS chemical line notation
    conforms: true
    evidence: >-
      `ocli molsearch query create exact <db> "CC(=O)Oc1ccccc1C(=O)O"` and
      `ocli molsearch create substructure 1 c1cocc1 --subsearch_query_type SMARTS`
      are published examples in the Orion CLI reference; `ocli molsearch query
      smiles <title>` returns a SMILES string for a named molecule.
    market: cheminformatics
  - id: eda-standards
    name: EDA interchange standards (IEEE 1801/UPF, Verilog/SystemVerilog, LEF/DEF, GDSII, IBIS, SPICE)
    conforms: null
    evidence: >-
      NOT ESTABLISHED HERE. Cadence is a principal author and implementer of the
      EDA standards estate, but this pipeline reads contracts, and no Cadence
      contract on a public host declares them. Recorded as unestablished rather
      than asserted from reputation.

