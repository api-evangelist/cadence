description: >-
  Cadence Design Systems publishes NO public plans, tiers, or list prices for any
  of its products or for the callable surfaces it operates (Orion, MMDS, Cadence
  OnCloud). Every commercial path is a quote: the EDA product lines are sold
  under negotiated enterprise licences, Orion / OpenEye software is sold through
  a "Let's Connect" contact form, and Cadence OnCloud is a subscription
  negotiated with sales. An academic licensing programme exists but publishes no
  price either.
plan_count: 0
plans: []
supersedes: >-
  This file previously carried a three-tier Free/Professional/Enterprise scaffold
  with invented request quotas (1,000/month free, 100,000/month professional,
  10/100/1000 rpm rate limits) written by the 2026-05-04 bulk sweep and marked
  method: generated. Cadence has never published any of those numbers. The
  scaffold is removed rather than left to be read as provider-published data.
evidence:
  - {url: 'https://www.eyesopen.com/pricing', status: 200, note: 'redirects to https://www.eyesopen.com/ — there is no pricing page; the site''s only commercial call to action is "Let''s Connect"'}
  - {url: 'https://www.eyesopen.com/contact', status: 200, note: sales contact form — the published route to a quote}
  - {url: 'https://www.eyesopen.com/academic-licensing', status: 200, note: academic licensing programme; application-based, no published price}
  - {url: 'https://oncloud.cadence.com/', status: 200, note: OnCloud Marketplace, gated behind a Cadence account}
  - {url: 'https://www.cadence.com/en_US/home/tools.html', status: 403, note: 'Cloudflare bot challenge; Cadence''s product pages carry no pricing in any case'}
usage_metering_note: >-
  Orion does expose consumption reporting to its own customers — `ocli cost
  export --report-type=storage_use|spend_summary` produces per-user storage and
  spend reports — so consumption IS metered and billed. The rate card behind it
  is contractual and unpublished.
