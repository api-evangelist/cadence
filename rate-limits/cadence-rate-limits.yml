specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Cadence Design Systems
providerId: cadence
generated: '2026-09-05'
method: searched
source: >-
  https://docs.eyesopen.com/orion-developer/modules/orion-platform/docs/orionclient/cli.html ·
  live probe of https://mmds.eyesopen.com/api/v1/auth/
created: '2026-05-04'
modified: '2026-09-05'
tags:
  - Electronic Design Automation
  - EDA
  - Rate Limiting
  - Quotas
  - Throttling
description: >-
  Cadence Design Systems publishes no rate limits for any of its callable
  surfaces. The Orion Programming Guide documents client-side timeout and retry
  behaviour and a server-side request timeout, but never a request-per-window
  limit; no RateLimit-*/X-RateLimit-* headers or 429 semantics are documented,
  and none were observable on the one anonymous endpoint that answers
  (mmds.eyesopen.com returns 403 before any limiter is reached).
limit_count: 0
limits: []
headers: {}
responseCodes: {}
supersedes: >-
  This file previously carried five invented tier limits (10/100/1000 requests
  per minute, 1,000/100,000 monthly quotas, X-RateLimit-* headers, 429/503
  response codes) written by the 2026-05-04 bulk sweep and marked
  method: generated. Cadence has published none of it. Removed rather than left
  to be read as provider-published data.
documented_runtime_limits:
  - name: Orion API server-side request timeout
    type: timeout
    value_seconds: 60
    quote: All requests to the Orion API have a maximum timeout of 60 seconds.
    source: https://docs.eyesopen.com/orion-developer/modules/orion-platform/docs/orionclient/cli.html
  - name: Orion CLI client timeout
    type: timeout
    value_seconds: 10
    note: "`--timeout` default 10 seconds; the client disconnects if the server takes longer."
    source: https://docs.eyesopen.com/orion-developer/modules/orion-platform/docs/orionclient/cli.html
  - name: Orion CLI retry policy
    type: retry
    value: "`--max-retries` default 2, exponential backoff; retries on connection failure or 404. Shard uploads/downloads are unaffected."
    source: https://docs.eyesopen.com/orion-developer/modules/orion-platform/docs/orionclient/cli.html
  - name: Orion 3D & Analyze result ceiling
    type: result-size
    value: approximately 300,000 records
    note: A UI/result-set ceiling raised in Orion 2026.1, not an API rate limit.
    source: https://docs.eyesopen.com/orion-user-interface/releasenotes/2026.1release.html
probe:
  - url: https://mmds.eyesopen.com/api/v1/auth/
    status: 403
    observed: '2026-09-05'
    note: >-
      Response headers carry no RateLimit-*, X-RateLimit-* or Retry-After field;
      only vary, allow, content-security-policy, strict-transport-security and
      x-content-type-options. Authentication is refused before any limiter would
      engage, so a limit cannot be ruled out — only observed to be unadvertised.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
