generated: '2026-09-05'
method: probed
source: live HTTPS probes of every host in apis.yml plus the eyesopen.com API/docs hosts
description: >-
  Named /.well-known/ discovery probes across every host the Cadence Design
  Systems record knows. One real document was found: support.cadence.com serves
  an RFC 8414 / OpenID Connect discovery document for Cadence Online Support
  (issuer https://support.cadence.com, a Salesforce Experience Cloud identity
  provider). Everything else 404s, is answered by an SPA/portal catch-all, or is
  turned away by Cloudflare's bot challenge on the cadence.com edge.
probed: '2026-09-05'
notes:
  - >-
    cadence.com, www.cadence.com and community.cadence.com sit behind a
    Cloudflare interstitial that answers 403 with a "Just a moment..." HTML body
    to a non-browser client on EVERY path, including paths that would 404. These
    are recorded as 403 and are NOT evidence that the documents are absent — nor
    that they are present.
  - >-
    support.cadence.com is a Salesforce Experience Cloud portal that answers 200
    with a Visualforce HTML shell for any unknown path. Only the
    openid-configuration response carries application/json and a real document;
    the other 200s on that host are soft-404s and are recorded as misses.
  - >-
    investor.cadence.com answers 200 with the body "Invalid key" for any unknown
    path — another soft-404, recorded as a miss.

